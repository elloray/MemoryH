[package]
name = "memoryh"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "An embedded store and retrieval engine for versioned memories"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
bge = ["inference"]
qwen = ["inference", "dep:rayon", "dep:ureq", "dep:serde_json", "dep:libloading", "dep:time"]
inference = ["dep:ort", "dep:tokenizers"]
python = ["dep:pyo3"]

[dependencies]
crc32fast = "1.5"
lru = "0.16"
thiserror = "2"
unicode-normalization = "0.1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "load-dynamic"], optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"], optional = true }
pyo3 = { version = "0.27", features = ["abi3-py312"], optional = true }
jieba-rs = "0.8.1"
rayon = { version = "1.11", optional = true }
ureq = { version = "3.1.4", default-features = false, features = ["json"], optional = true }
serde_json = { version = "1", optional = true }
time = { version = "0.3", optional = true }
libloading = { version = "0.9", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[example]]
name = "bge_benchmark"
required-features = ["bge"]

[[example]]
name = "group_commit_benchmark"
required-features = ["bge"]

[[example]]
name = "qwen_benchmark"
required-features = ["qwen"]

[[example]]
name = "qwen_reindex"
required-features = ["qwen"]

[[example]]
name = "scann_benchmark"
required-features = ["qwen"]

[[example]]
name = "locomo_qwen"
required-features = ["qwen"]
