[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "memoryh-store"
version = "0.1.0"
requires-python = ">=3.12"

[tool.maturin]
module-name = "memoryh_store"
features = ["python", "pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
